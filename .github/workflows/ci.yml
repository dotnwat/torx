name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target; macOS is where suites are developed.
        # The ssh backend tests run commands on the host through an in-process
        # server, so both exercise the remote-side shell code paths natively.
        os: [ubuntu-latest, macos-latest]
        # oldstable is the minimum go.mod allows; stable is what contributors run.
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # Linters and settings live in .golangci.yml (staticcheck is in its
      # standard set); run the same thing locally with `golangci-lint run`.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The rqlite example's end-to-end test needs rqlited installed, which the
  # matrix above does not provide, so it skips there. This job installs a
  # pinned release, runs the example's tests with the skip turned into a
  # failure, and then runs every job through the example's harness, which is
  # the one place the harness's own path is exercised.
  example-rqlite:
    name: example (rqlite)
    runs-on: ubuntu-latest
    env:
      RQLITE_VERSION: v10.3.6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: install rqlite
        run: |
          curl -fsSL "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rqlite-${RQLITE_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: rqlited is on PATH
        run: rqlited -version
      - name: example tests (rqlited required)
        run: go test -race -count=1 ./examples/rqlite/...
        env:
          TORX_RQLITE_REQUIRED: "1"
      - name: run the suite through the harness
        run: go run ./examples/rqlite/harness

  # -netns builds local nodes from unprivileged user and network namespaces,
  # which Ubuntu's AppArmor policy forbids by default, so the matrix above
  # skips the lab test. This job lifts the restriction, runs netfault's
  # tests with the skip turned into a failure, and runs the rqlite chaos job
  # under -netns, where its network faults are in play.
  netns:
    name: netns lab
    runs-on: ubuntu-latest
    env:
      RQLITE_VERSION: v10.3.6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: let unprivileged users create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: install nftables
        run: sudo apt-get install -y nftables
      - name: netfault tests (lab required)
        run: go test -race -count=1 ./netfault
        env:
          NETFAULT_LAB_REQUIRED: "1"
      - name: install rqlite
        run: |
          curl -fsSL "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rqlite-${RQLITE_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: run the rqlite chaos job under -netns
        run: go run ./examples/rqlite/harness -netns 'rqlite\.chaos'

  # The tutorial's last step provisions docker containers and runs the suite
  # against them over ssh. The matrix above skips that test where docker is
  # not usable; this job runs it with the skip turned into a failure, and
  # then runs every tutorial job through the launcher on the docker backend.
  example-tutorial:
    name: example (tutorial, docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: docker is usable
        run: docker info
      - name: tutorial tests (docker required)
        run: go test -race -count=1 ./examples/tutorial/...
        env:
          TORX_DOCKER_REQUIRED: "1"
      - name: run the suite through the launcher on docker
        run: go run ./examples/tutorial/06-launcher/launcher -backend docker -parallel 3
