<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-labelledby="title desc">
  <title id="title">torx architecture</title>
  <desc id="desc">The suite binary runs as the driver, which allocates nodes from its pool to each job and runs the job in a worker, the same binary re-executed. Inside a worker the job's services run on the nodes bound to them. Every call a service makes on a node goes through the node's Backend: local subprocesses, docker containers, or real hosts over ssh.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .title { font-size: 13px; font-weight: 600; }
    .muted { fill: #57606a; }
    .small { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .outer { fill: #f6f8fa; stroke: #d0d7de; }
    .inner { fill: #ffffff; stroke: #d0d7de; }
    .arrow { stroke: #57606a; stroke-width: 1.5; marker-end: url(#head); }
    .node text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .node.a rect { fill: #ddf4ff; stroke: #54aeff; } .node.a text { fill: #0969da; }
    .node.b rect { fill: #dafbe1; stroke: #4ac26b; } .node.b text { fill: #1a7f37; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="760" height="334" fill="#ffffff"/>

  <!-- the driver: the suite binary, and the pool it allocates from -->
  <rect class="outer" x="16" y="16" width="728" height="66" rx="6"/>
  <text x="30" y="38"><tspan class="title">driver</tspan> <tspan class="muted">the suite binary:</tspan> discovers jobs, allocates each one disjoint nodes from the pool, runs it in a worker</text>
  <text class="muted" x="30" y="64">pool</text>
  <g class="node a">
    <rect x="64" y="50" width="34" height="20" rx="4"/>
    <text x="81" y="64" text-anchor="middle">n0</text>
  </g>
  <g class="node a">
    <rect x="104" y="50" width="34" height="20" rx="4"/>
    <text x="121" y="64" text-anchor="middle">n1</text>
  </g>
  <g class="node a">
    <rect x="144" y="50" width="34" height="20" rx="4"/>
    <text x="161" y="64" text-anchor="middle">n2</text>
  </g>
  <g class="node b">
    <rect x="184" y="50" width="34" height="20" rx="4"/>
    <text x="201" y="64" text-anchor="middle">n3</text>
  </g>
  <g class="node b">
    <rect x="224" y="50" width="34" height="20" rx="4"/>
    <text x="241" y="64" text-anchor="middle">n4</text>
  </g>
  <g class="node b">
    <rect x="264" y="50" width="34" height="20" rx="4"/>
    <text x="281" y="64" text-anchor="middle">n5</text>
  </g>
  <text class="small muted" x="314" y="64">a node: scratch directory, port allocator, reachable address, Backend</text>

  <!-- the driver hands each worker one assignment -->
  <line class="arrow" x1="190" y1="82" x2="190" y2="120"/>
  <line class="arrow" x1="570" y1="82" x2="570" y2="120"/>
  <text class="muted" x="380" y="106" text-anchor="middle">assignment: job id, params, nodes</text>

  <!-- worker running job A -->
  <rect class="outer" x="16" y="122" width="348" height="72" rx="6"/>
  <text x="30" y="143"><tspan class="title">worker</tspan> <tspan class="muted">the same binary, re-executed, running job A</tspan></text>
  <text class="muted" x="30" y="172">services</text>
  <rect class="inner" x="86" y="154" width="144" height="28" rx="4"/>
  <text class="mono" x="96" y="172">server</text>
    <g class="node a">
      <rect x="146" y="158" width="34" height="20" rx="4"/>
      <text x="163" y="172" text-anchor="middle">n0</text>
    </g>
    <g class="node a">
      <rect x="186" y="158" width="34" height="20" rx="4"/>
      <text x="203" y="172" text-anchor="middle">n1</text>
    </g>
  <rect class="inner" x="238" y="154" width="90" height="28" rx="4"/>
  <text class="mono" x="248" y="172">load</text>
    <g class="node a">
      <rect x="284" y="158" width="34" height="20" rx="4"/>
      <text x="301" y="172" text-anchor="middle">n2</text>
    </g>

  <!-- worker running job B -->
  <rect class="outer" x="396" y="122" width="348" height="72" rx="6"/>
  <text x="410" y="143"><tspan class="title">worker</tspan> <tspan class="muted">running job B</tspan></text>
  <text class="muted" x="410" y="172">services</text>
  <rect class="inner" x="466" y="154" width="104" height="28" rx="4"/>
  <text class="mono" x="476" y="172">server</text>
    <g class="node b">
      <rect x="526" y="158" width="34" height="20" rx="4"/>
      <text x="543" y="172" text-anchor="middle">n3</text>
    </g>
  <rect class="inner" x="578" y="154" width="130" height="28" rx="4"/>
  <text class="mono" x="588" y="172">load</text>
    <g class="node b">
      <rect x="624" y="158" width="34" height="20" rx="4"/>
      <text x="641" y="172" text-anchor="middle">n4</text>
    </g>
    <g class="node b">
      <rect x="664" y="158" width="34" height="20" rx="4"/>
      <text x="681" y="172" text-anchor="middle">n5</text>
    </g>

  <!-- every call a service makes on a node goes through the node's Backend -->
  <line class="arrow" x1="190" y1="194" x2="190" y2="232"/>
  <line class="arrow" x1="570" y1="194" x2="570" y2="232"/>
  <text class="muted" x="380" y="218" text-anchor="middle">every call a service makes on a node</text>

  <!-- the Backend interface and the transports that implement it -->
  <rect class="outer" x="16" y="234" width="728" height="84" rx="6"/>
  <text x="30" y="255"><tspan class="title">Backend</tspan> <tspan class="muted">one per node</tspan></text>
  <text class="mono" x="180" y="255" xml:space="preserve">Exec  Stream  Put  Get  ReadFile  WriteFile  Exists  Mkdir  Rm  Signal</text>
  <rect class="inner" x="30" y="264" width="225" height="44" rx="4"/>
  <text class="title" x="142" y="282" text-anchor="middle">Local</text>
  <text class="small muted" x="142" y="298" text-anchor="middle">subprocesses on the driver host</text>
  <rect class="inner" x="267" y="264" width="225" height="44" rx="4"/>
  <text class="title" x="379" y="282" text-anchor="middle">Docker</text>
  <text class="small muted" x="379" y="298" text-anchor="middle">containers, through docker exec</text>
  <rect class="inner" x="504" y="264" width="225" height="44" rx="4"/>
  <text class="title" x="616" y="282" text-anchor="middle">SSH</text>
  <text class="small muted" x="616" y="298" text-anchor="middle">real hosts and VMs on a real network</text>
</svg>
